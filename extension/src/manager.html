<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="manager.css">
<link rel="stylesheet" href="entry-card.css">
<link rel="stylesheet" href="profiles.css">
</head>
<body>
  <!-- La barra estándar del ecosistema (CONVENCIONES §5), vendorizada: MV3 solo importa
       de su propia carpeta, y al copiarla se le quita el contador de aperturas, que
       llegaba a un servidor por un import() remoto (ver extension/build.mjs).
       · `no-back`: no se viene de ninguna parte.
       · `profile`: el botón de perfil del §6.1. El topbar no abre nada por su cuenta si no
         se le pasa `identity` —solo emite `dotrino-profile`—, así que la tarjeta la monta
         esta app con su propio proveedor (`profile-card.js`), que es lo que le da acceso a
         la identidad del service worker.
       · `support-no-bubble`: en una ventana que se abre veinte veces al día, una burbuja
         que sale sola tapa el contenido en cada apertura.
       · `support-no-count`: un gestor de contraseñas no avisa a un servidor de que lo
         abriste. (El vendor además le quita el código que lo haría.) -->
  <dotrino-topbar
    brand="Dotrino"
    icon="../icons/icon-32.png"
    no-back
    profile
    support-no-bubble
    support-no-count
    support-repo="imdotrino/dotrino-passmanager"
    support-discord="https://discord.gg/D648uq7cth"></dotrino-topbar>

  <main id="view"></main>
  <p id="toast" class="toast" hidden></p>

  <script type="module" src="vendor/topbar/index.js"></script>
  <script type="module" src="manager.js"></script>
</body>
</html>
