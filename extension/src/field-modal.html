<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161c;
    color: #e9edf2;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
  }
  /* La marca, igual que en el aviso de después de entrar: quién pregunta. */
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand img { width: 16px; height: 16px; display: block; }
  .brand b { font-size: .86rem; }

  /* DÓNDE: la misma lista de radios del aviso (dueño, 2026-08-28: «es mucho mejor que
     seleccionar con las flechas»). Una entrada por fila, con su fecha para distinguir
     dos que se llamen igual, y la nueva al final. */
  .t {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: baseline; gap: 8px; padding: 4px 5px; cursor: pointer;
  }
  .t input { margin: 0; accent-color: #00658c; }
  .t .who2 { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t .when { font-size: .7rem; opacity: .55; white-space: nowrap; }

  h2 {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    opacity: .5; margin: 10px 0 4px; font-weight: 600;
  }
  /* El título de la sección y, a su derecha, la lupa. Sutil a propósito: está siempre,
     así que no puede pesar más que lo que hay debajo. */
  .h2row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .icon {
    background: none; border: 0; padding: 2px; margin: 10px 0 4px;
    color: inherit; opacity: .4; cursor: pointer; line-height: 0;
  }
  .icon:hover, .icon[aria-expanded="true"] { opacity: 1; }
  .icon svg { width: 13px; height: 13px; display: block; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 12px 0 0; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  /* Cinco filas caben; de ahí en adelante, scroll. Vale para las tres listas: entradas,
     lo que se puede rellenar y lo que se puede guardar. Un modal anclado a un campo no
     puede crecer hasta tapar la página. */
  #targets, #fillList, #saveList { max-height: 132px; overflow-y: auto; }
  #targets li:hover { background: rgba(255,255,255,.05); }
  #q {
    width: 100%; margin: 2px 0 5px; padding: 5px 7px;
    font: inherit; font-size: .8rem;
    color: inherit; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); border-radius: 7px;
  }
  #q:focus { outline: 2px solid #00658c; outline-offset: -1px; }
  li { border-radius: 7px; }
  li:hover { background: rgba(255,255,255,.05); }
  /* Casilla · nombre · con qué se rellena · botón. Las dos de en medio tienen su parte
     y truncan por su cuenta: con `auto` un correo largo se comía el nombre entero y
     «Correo» quedaba en «C». El nombre manda —es lo que se lee para elegir—, y el valor
     es la pista que lo distingue de otra fila igual. */
  .row {
    display: grid; grid-template-columns: auto minmax(0,1.3fr) minmax(0,1fr) auto;
    align-items: center; gap: 8px; padding: 4px 5px;
  }
  .row input[type=checkbox] { margin: 0; accent-color: #00658c; }
  /* La fila de guardar no lleva casilla de elegir: es el nombre, si es privado, y su
     botón —que dice guardar o reemplazar según lo que vaya a hacer. */
  .row.save { grid-template-columns: minmax(0,1fr) auto auto; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Con qué se va a rellenar: pequeño, tenue y truncado (dueño, 2026-08-29). Está para
     distinguir dos filas que se llaman igual, no para leerlo entero. */
  .val {
    font-size: .7rem; opacity: .5; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  button { font: inherit; cursor: pointer; border-radius: 7px; }
  .mini {
    padding: 3px 8px; font-size: .74rem;
    background: none; color: #7fc6e6; border: 1px solid rgba(127,198,230,.35);
  }
  .wide {
    width: 100%; margin-top: 6px; padding: 7px;
    background: none; color: inherit; border: 1px solid rgba(255,255,255,.22);
  }
  /* No hay botón de cerrar: el modal se cierra al pulsar fuera, como cualquier menú.
     Un botón que solo cierra ocupa el sitio de lo que sí hace algo. */
  .buttons { display: flex; gap: 8px; margin-top: 10px; }
  /* Más delgado que un botón normal: es el remate de la lista, no su protagonista. */
  .buttons > button { flex: 1; padding: 6px; font-size: .82rem; }
  .primary { border: 0; padding: 8px; background: #00658c; color: #fff; font-weight: 600; }
  .ghost { border: 1px solid rgba(255,255,255,.22); background: none; color: inherit; padding: 8px 12px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .priv { display: flex; align-items: center; gap: 5px; font-size: .74rem; opacity: .75; }
  .err { color: #ff8a8a; font-size: .76rem; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../icons/icon-32.png" alt="">
    <b>Dotrino Pass Manager</b>
  </div>

  <div id="whereBox" hidden>
    <div class="h2row">
      <h2 id="whereTitle"></h2>
      <button class="icon" id="qBtn" type="button" data-testid="field-modal-search-toggle"
              aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round">
          <circle cx="7" cy="7" r="4.2"></circle><path d="M10.2 10.2 14 14"></path>
        </svg>
      </button>
    </div>
    <input type="search" id="q" data-testid="field-modal-search" hidden>
    <ul id="targets"></ul>
  </div>

  <div id="fillBox" hidden>
    <h2 id="fillTitle"></h2>
    <ul id="fillList"></ul>
    <button class="wide" id="fillAll" data-testid="field-modal-fill-all"></button>
  </div>

  <div id="saveBox" hidden>
    <hr>
    <h2 id="saveTitle"></h2>
    <ul id="saveList"></ul>
  </div>

  <p class="err" id="err" hidden></p>
  <div class="buttons">
    <button class="primary" id="save" data-testid="field-modal-save"></button>
  </div>
  <script type="module" src="field-modal.js"></script>
</body>
</html>
