<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161c;
    color: #e9edf2;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
  }
  /* Cabecera: de qué entrada se habla, y las flechas para cambiarla. */
  .head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 6px; }
  .rec { text-align: center; overflow: hidden; }
  .rec b { display: block; font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec span { font-size: .7rem; opacity: .55; }
  .arrow {
    background: none; border: 1px solid rgba(255,255,255,.18); color: inherit;
    border-radius: 7px; width: 26px; height: 26px; font: inherit; cursor: pointer;
  }
  .arrow:disabled { opacity: .3; cursor: default; }

  h2 {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    opacity: .5; margin: 12px 0 4px; font-weight: 600;
  }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 12px 0 0; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  li { border-radius: 7px; }
  li:hover { background: rgba(255,255,255,.05); }
  .row {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center; gap: 8px; padding: 4px 5px;
  }
  .row input[type=checkbox] { margin: 0; accent-color: #00658c; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val { font-size: .74rem; opacity: .5; }

  button { font: inherit; cursor: pointer; border-radius: 7px; }
  .mini {
    padding: 3px 8px; font-size: .74rem;
    background: none; color: #7fc6e6; border: 1px solid rgba(127,198,230,.35);
  }
  .wide {
    width: 100%; margin-top: 6px; padding: 7px;
    background: none; color: inherit; border: 1px solid rgba(255,255,255,.22);
  }
  /* En fila, y el de guardar crece. Cuando no hay nada que guardar se queda solo
     «Cerrar», y entonces ocupa el ancho él: con una rejilla de dos columnas quedaba
     descolgado a la izquierda. */
  .buttons { display: flex; gap: 8px; margin-top: 10px; }
  .buttons > button { flex: 1; }
  .buttons > button.ghost { flex: 0 0 auto; }
  .buttons > button.ghost:only-child { flex: 1; }
  .primary { border: 0; padding: 8px; background: #00658c; color: #fff; font-weight: 600; }
  .ghost { border: 1px solid rgba(255,255,255,.22); background: none; color: inherit; padding: 8px 12px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .priv { display: flex; align-items: center; gap: 5px; font-size: .74rem; opacity: .75; }
  .err { color: #ff8a8a; font-size: .76rem; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="head">
    <button class="arrow" id="prev" data-testid="field-modal-prev" aria-label="anterior">‹</button>
    <div class="rec"><b id="recName"></b><span id="recWhen"></span></div>
    <button class="arrow" id="next" data-testid="field-modal-next" aria-label="siguiente">›</button>
  </div>

  <div id="fillBox" hidden>
    <h2 id="fillTitle"></h2>
    <ul id="fillList"></ul>
    <button class="wide" id="fillAll" data-testid="field-modal-fill-all"></button>
  </div>

  <div id="saveBox" hidden>
    <hr>
    <h2 id="saveTitle"></h2>
    <div class="row">
      <span></span>
      <span class="name" id="saveName"></span>
      <label class="priv"><input type="checkbox" id="private" data-testid="field-modal-private"><span id="privLabel"></span></label>
    </div>
  </div>

  <p class="err" id="err" hidden></p>
  <div class="buttons">
    <button class="primary" id="save" data-testid="field-modal-save"></button>
    <button class="ghost" id="close" data-testid="field-modal-close"></button>
  </div>
  <script type="module" src="field-modal.js"></script>
</body>
</html>
