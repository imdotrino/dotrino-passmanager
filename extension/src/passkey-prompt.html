<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--panel);
    color: var(--fg);
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
  }
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand img { width: 18px; height: 18px; display: block; }
  h1 { font-size: .95rem; margin: 0; }
  .who { font-size: .82rem; opacity: .72; word-break: break-all; margin-top: 4px; }
  .why { font-size: .78rem; opacity: .55; margin-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: .5rem .8rem; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,.22); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .err { color: #ff8a8a; font-size: .8rem; margin: 8px 0 0; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../icons/icon-32.png" alt="">
    <h1 id="title"></h1>
  </div>
  <div class="who" id="who" data-testid="passkey-prompt-who"></div>
  <div class="why" id="why"></div>
  <p class="err" id="err" hidden></p>
  <div class="row">
    <button id="save" data-testid="passkey-prompt-save" disabled></button>
    <button id="no" class="ghost" data-testid="passkey-prompt-dismiss"></button>
  </div>
  <script type="module" src="passkey-prompt.js"></script>
</body>
</html>
