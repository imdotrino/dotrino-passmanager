<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161c;
    color: #e9edf2;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
  }
  h1 { font-size: .95rem; margin: 0 0 2px; }
  .who { font-size: .82rem; opacity: .72; word-break: break-all; }
  .note { font-size: .78rem; opacity: .72; margin: 8px 0 0; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: .5rem .8rem; background: #00658c; color: #fff;
  }
  button.ghost { background: transparent; color: #e9edf2; border: 1px solid rgba(255,255,255,.22); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .err { color: #ff8a8a; font-size: .8rem; margin: 8px 0 0; }

  /* La lista de lo que se va a escribir: una fila por dato, con su casilla. */
  .fields { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
  .fields li { border-radius: 8px; }
  .fields li:hover { background: rgba(255,255,255,.05); }
  /* Cuatro columnas, una por pieza: casilla · qué es · qué se va a escribir · si es
     nuevo o si cambia. Con tres, la etiqueta de nuevo/cambia caía a otra línea. */
  .f {
    display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto;
    align-items: baseline; gap: 8px; padding: 5px 6px; cursor: pointer;
  }
  .f input { margin: 0; accent-color: #00658c; }
  .k { font-size: .78rem; opacity: .7; }
  .v {
    font-size: .84rem; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag {
    font-size: .68rem; text-transform: lowercase; letter-spacing: .02em;
    padding: 1px 6px; border-radius: 999px;
    background: rgba(0,101,140,.55); color: #dff1fa;
  }
  .tag.changed { background: rgba(190,140,0,.35); color: #ffe6a8; }
  /* Lo que había antes, para que «cambia» diga qué cambia. */
  .old {
    display: block; font-size: .72rem; opacity: .55;
    padding: 0 6px 5px 30px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-decoration: line-through;
  }
</style>
</head>
<body>
  <h1 data-t="title">¿Guardo esta contraseña?</h1>
  <div class="who"><span id="user"></span> · <span id="host"></span></div>
  <p class="note" id="note" hidden></p>
  <ul class="fields" id="fields"></ul>
  <p class="err" id="err" hidden></p>
  <div class="row">
    <button id="save" data-testid="save-prompt-save"></button>
    <button id="update" class="ghost" data-testid="save-prompt-update" hidden></button>
    <button id="no" class="ghost" data-testid="save-prompt-dismiss"></button>
  </div>
  <script type="module" src="save-prompt.js"></script>
</body>
</html>
