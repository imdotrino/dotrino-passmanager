<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dotrino</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161c;
    color: #e9edf2;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
  }
  /* La marca, con su pájaro: quién pregunta, no qué se pregunta. Lo que se va a hacer
     lo dicen las secciones de abajo, que es donde se mira. */
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand img { width: 18px; height: 18px; display: block; }
  h1 { font-size: .95rem; margin: 0; }
  .who { font-size: .82rem; opacity: .72; word-break: break-all; margin-top: 2px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: .5rem .8rem; background: #00658c; color: #fff;
  }
  button.ghost { background: transparent; color: #e9edf2; border: 1px solid rgba(255,255,255,.22); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .err { color: #ff8a8a; font-size: .8rem; margin: 8px 0 0; }

  /* DÓNDE se guarda: una entrada nueva, o una de las que ya hay para este sitio. De
     cada candidata se enseña solo lo público — la pista del usuario y cuándo se tocó. */
  .where { margin-top: 10px; }
  .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; opacity: .5; }
  .targets { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
  /* Cinco filas caben; de ahí en adelante, scroll. Igual en las dos listas y igual que
     en el modal de un campo. */
  .targets, .fields { max-height: 140px; overflow-y: auto; }
  .targets li { border-radius: 8px; }
  .targets li:hover { background: rgba(255,255,255,.05); }
  /* Cuatro columnas, como las filas de datos: radio · quién · cuándo · etiqueta. Con
     tres, la etiqueta caía a otra línea y cada candidata ocupaba el doble. */
  /* Cuatro columnas, como las filas de datos: radio · quién · cuándo · etiqueta. Con
     tres, la etiqueta caía a otra línea y cada candidata ocupaba el doble.
     El que se recorta es el usuario, no la fecha: cuando dos entradas tienen el mismo
     usuario, la fecha es lo ÚNICO que las distingue. */
  .t {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
    align-items: baseline; gap: 8px; padding: 5px 6px; cursor: pointer;
  }
  .t input { margin: 0; accent-color: #00658c; }
  .t .who2 {
    font-size: .84rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .t .when { font-size: .72rem; opacity: .55; white-space: nowrap; }

  /* «Ver qué cambia»: con una bóveda conectada, saberlo cuesta una aprobación, así que
     se pide y no se hace solo. */
  .link {
    background: none; color: #7fc6e6; padding: 6px 0 0;
    font-size: .78rem; text-decoration: underline; text-underline-offset: 2px;
  }

  /* La lista de lo que se va a escribir: una fila por dato, con su casilla. */
  .fields { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
  #fieldsLabel { margin-top: 12px; }
  .fields li { border-radius: 8px; }
  .fields li:hover { background: rgba(255,255,255,.05); }
  /* Cuatro columnas, una por pieza: casilla · qué es · qué se va a escribir · si es
     nuevo o si cambia. Con tres, la etiqueta de nuevo/cambia caía a otra línea. */
  .f {
    display: grid; grid-template-columns: auto minmax(0, auto) minmax(0, 1fr) auto;
    align-items: baseline; gap: 8px; padding: 5px 6px; cursor: pointer;
  }
  .f input { margin: 0; accent-color: #00658c; }
  /* El nombre puede ser largo (el de un campo libre lo pone el sitio): se recorta él,
     porque el valor es lo que hay que poder leer para decidir. */
  .k {
    font-size: .78rem; opacity: .7;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .v {
    font-size: .84rem; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag {
    font-size: .68rem; text-transform: lowercase; letter-spacing: .02em;
    padding: 1px 6px; border-radius: 999px;
    background: rgba(0,101,140,.55); color: #dff1fa;
  }
  .tag.changed { background: rgba(190,140,0,.35); color: #ffe6a8; }
  /* Lo que había antes, para que «cambia» diga qué cambia. */
  .old {
    display: block; font-size: .72rem; opacity: .55;
    padding: 0 6px 5px 30px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-decoration: line-through;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="../icons/icon-32.png" alt="">
    <h1 data-t="title">Dotrino Pass Manager</h1>
  </div>
  <div class="who" id="who" data-testid="save-prompt-who"></div>
  <div class="where" id="where" hidden>
    <div class="lbl" id="whereLabel"></div>
    <ul class="targets" id="targets"></ul>
  </div>
  <div class="lbl" id="fieldsLabel" hidden></div>
  <ul class="fields" id="fields"></ul>
  <button class="link" id="reveal" data-testid="save-prompt-reveal" hidden></button>
  <p class="err" id="err" hidden></p>
  <div class="row">
    <button id="save" data-testid="save-prompt-save"></button>
    <button id="no" class="ghost" data-testid="save-prompt-dismiss"></button>
  </div>
  <script type="module" src="save-prompt.js"></script>
</body>
</html>
