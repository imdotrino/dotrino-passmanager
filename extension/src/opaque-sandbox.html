<head><meta charset="utf-8"><title>opaque</title></head>
<body>
<!--
  LA PÁGINA SANDBOX: aquí y solo aquí corre el WASM de OPAQUE.
                                                                                        
  Por qué existe: en Chrome una página sandbox no tiene `chrome.*`, así que el WASM corre
  sin acceso a nada de la extensión. Firefox no tiene páginas sandbox (ignora la clave
  `sandbox` del manifiesto) y la carga como una página más; por eso las páginas de la
  extensión declaran `wasm-unsafe-eval` (2026-11-08: un solo paquete para Chrome, Firefox y
  Vivaldi). Ese permiso solo deja compilar WebAssembly que viene de la propia extensión;
  `eval` de JavaScript sigue prohibido.

  Lo que hay aquí dentro es solo cálculo: entran cadenas, salen cadenas. No tiene acceso a
  `chrome.*`, no guarda nada, y no es `web_accessible_resource` — así que no la puede
  embeber ninguna página de internet: solo el gestor, que es quien la crea.
-->
<script type="module" src="opaque-sandbox.js"></script>
</body>
</html>
