<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Entrar</title></head><body>
<!--
  Un acceso que NAVEGA al enviar, que es el caso que importa para el aviso de guardar:
  al llegar a `dentro.html` ya no queda nada escrito que leer, y por eso el gestor tiene
  que haberlo capturado antes y preguntarlo allí.
-->
<h1>Entrar</h1>
<form id="login" method="GET" action="dentro.html">
  <label>Usuario <input name="user" type="text" autocomplete="username"></label>
  <label>Contraseña <input name="password" type="password" autocomplete="current-password"></label>
  <button type="submit">Entrar</button>
</form>
</body></html>
