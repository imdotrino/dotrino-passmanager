<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>Campos de datos · caso 8</title><link rel="stylesheet" href="bench.css">
</head><body>
<nav><a href="./">← banco de pruebas</a></nav>
<h3>Checkout con autocomplete declarado</h3>
<form id="f1">
  <input autocomplete="email" placeholder="correo">
  <input autocomplete="shipping tel" placeholder="teléfono">
  <input autocomplete="street-address" placeholder="dirección">
  <input autocomplete="postal-code" placeholder="CP">
  <input autocomplete="off" placeholder="cupón (autocomplete off)">
</form>

<h3>Sin autocomplete: solo pistas</h3>
<form id="f2">
  <input name="cedula" placeholder="Cédula">
  <input name="company" placeholder="Empresa">
  <input type="search" name="search" placeholder="Buscar (NO es un dato)">
</form>

<h3>Dos campos que reclaman la misma clase (caso 12)</h3>
<!--
  El caso real de profile.dotrino.com: el primer campo se llama «Tu nombre visible», y en
  español esa etiqueta lleva la palabra «nombre», que es una pista de `given-name`. Antes
  se quedaba con la clase y el campo «Nombres» —el de verdad— se caía sin marcador y sin
  rastro. Aquí no hay `autocomplete` a propósito: es lo que hace que la etiqueta mande.
-->
<form id="f4">
  <label>Tu nombre visible <input placeholder="Tu nombre"></label>
  <label>Nombres <input placeholder="Tus nombres"></label>
  <label>Apellidos <input placeholder="Tus apellidos"></label>
</form>

<h3>Acceso</h3>
<form id="f3">
  <input name="email" type="email" placeholder="correo">
  <input name="password" type="password" placeholder="contraseña">
</form>
</body></html>
