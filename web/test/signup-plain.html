<!doctype html>
<html lang="es">
<head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>Registrarse sin declarar nada</title><link rel="stylesheet" href="bench.css"></head>
<body>
<!--
  Un registro que no declara `new-password`: lo delata la casilla de «repite la contraseña».
  Aquí SÍ se ofrece generar.
-->
<nav><a href="./">← banco de pruebas</a></nav>
<h1>Registrarse (sin declarar nada)</h1>
<form id="signup" onsubmit="return false">
  <label>Correo <input name="email" type="text"></label>
  <label>Contraseña <input name="pass1" type="password"></label>
  <label>Repite la contraseña <input name="pass2" type="password"></label>
  <button type="submit">Crear cuenta</button>
</form>
</body></html>
