<!doctype html>
<html lang="es">
<head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>Entrar · dentro de un marco</title><link rel="stylesheet" href="bench.css"></head>
<body>
<!--
  El acceso vive en un marco de OTRO sitio, como los de un proveedor de acceso embebido.
  Al enviarse solo recarga el marco: el aviso de guardar tiene que salir en esta página,
  la principal, y nunca dentro del marco.
-->
<nav><a href="./">← banco de pruebas</a></nav>
<h1>Entrar, dentro de un marco</h1>
<p class="lead">El formulario está en un marco de otro sitio.</p>
<iframe id="marco" title="Acceso" style="width:100%;height:360px;border:1px solid #8884"></iframe>
<script>
  // El otro «sitio» es el mismo servidor por su otro nombre: para el navegador son dos.
  const otro = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost'
  document.getElementById('marco').src = `${location.protocol}//${otro}:${location.port}/login.html`
</script>
</body></html>
