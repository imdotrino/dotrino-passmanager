<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu bóveda — Dotrino</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00658c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>window.goatcounter={path:function(p){return location.hostname+p}}</script>
<script data-goatcounter="https://goat.dotrino.com/count" async src="https://goat.dotrino.com/count.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@dotrino/topbar@0.8/+esm"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="devices.css?v=2">
<style>
  .estado { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 15px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: #c0392b; flex: none; }
  .punto.on { background: #46c98b; }
  .codigo {
    display: block; padding: 12px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--line); font-size: 11px; line-height: 1.4;
    word-break: break-all; cursor: pointer; color: var(--dim);
  }
  .codigo:hover { color: var(--fg); }
  .aviso {
    margin: 0 0 20px; padding: 12px 14px; border-radius: 10px;
    background: color-mix(in srgb, #c0392b 8%, transparent);
    border: 1px solid var(--line); font-size: 14px; color: var(--dim);
  }
  .peticion { font-size: 13px; color: var(--dim); font-family: ui-monospace, monospace; }
  dialog {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    color: var(--fg); padding: 22px; max-width: 360px;
  }
  dialog::backdrop { background: rgba(10,14,18,.45); }
  dialog .row { margin-top: 18px; }
</style>
</head>
<body>

<dotrino-topbar
  brand-name="Tu bóveda"
  brand-href="./"
  support-repo="imdotrino/dotrino-passmanager"
  support-discord="https://discord.gg/D648uq7cth"></dotrino-topbar>

<main id="app">
  <p class="loading">Abriendo tu bóveda…</p>
</main>

<!-- Aprobar es del usuario y está delante: se le pregunta aquí, no en un log. -->
<dialog id="aprobar">
  <strong id="aprobar-quien"></strong>
  <p class="hint" id="aprobar-texto"></p>
  <div class="row">
    <button class="danger" id="aprobar-no">No</button>
    <button id="aprobar-si" style="padding:9px 16px;border:0;border-radius:9px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer">Sí, dásela</button>
  </div>
</dialog>

<script type="module" src="vault-in-tab-ui.js?v=1"></script>
</body>
</html>
