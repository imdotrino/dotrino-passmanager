name: Deploy to GitHub Pages

# La landing es estática y vive en `web/`, así que no hay build: se sube esa carpeta
# tal cual. Va por Actions y no por rama porque Pages solo sabe servir `/` o `/docs`,
# y la raíz de este repo es el proyecto entero (lib, extension, docs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
