# Publica @dotrino/passmanager DESDE CI, no desde el portátil de nadie.
#
# Hasta hoy este paquete se publicaba a mano: no había forma de comprobar de qué commit
# salió una versión, y se saltaba el `npm test` que aquí corre ANTES de publicar — que es lo
# único que impide sacar algo roto (`CLAUDE.md`, «al terminar una tarea»).
#
# Sin ningún token: npm cambia un credencial efímero por la identidad OIDC de esta ejecución
# (publicación de confianza) y firma la procedencia él solo. La confianza se declara en
# npmjs.com, por paquete: repo `imdotrino/dotrino-passmanager`, workflow `release.yml` y
# **el paquete vive en `lib/`**. El nombre de este archivo tiene que coincidir exacto.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # crear la release y subirle el SBOM
  id-token: write      # OIDC: la publicación de confianza y la atestación
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La publicación de confianza pide Node ≥22.14 y npm ≥11.5.1, y Node 22 trae
          # npm 10: por eso el paso siguiente lo sube.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm i -g npm@latest
      - run: npm install

      # LAS PRUEBAS, ANTES DE PUBLICAR. Es lo que separa «se publicó» de «se publicó algo
      # que funciona», y la única razón por la que esto no es `npm publish` a mano.
      - run: npm test

      - name: SBOM (CycloneDX)
        working-directory: lib
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev --output-format JSON \
            --output-file "sbom-$(node -p "require('./package.json').version").cdx.json"

      - name: Atestiguar el SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'lib/sbom-*.cdx.json'

      # La procedencia sale sola: npm la genera y la firma, sin `--provenance`.
      - name: Publicar en npm
        working-directory: lib
        run: npm publish --access public

      - uses: softprops/action-gh-release@v2
        with:
          files: 'lib/sbom-*.cdx.json'
          generate_release_notes: true
